version: 2

sources:
  - name: raw
    database: projectdb
    schema: bronze
    tables:
      - name: countries
        columns:
          - name: cty_pkey
            description: "Primary Key"
          - name: cty_cd2
            description: "Unique Code Alpha2"
          - name: cty_cd3
            description: "Unique Code Alpha3"
          - name: cty_iso
            description: "Numeric Iso"
          - name: fips_cd
            description: "fips"
          - name: country
            description: "Country Name"
          - name: capital
            description: "Capital Name"
          - name: area
            description: "Area per KM2"
          - name: population
            description: "Total Population"
          - name: continent
            description: "Continental"

  - name: dimension
    database: projectdb
    schema: silver
    tables:
      - name: dim_area
        columns:
          - name: country_id
            description: "Unique ID"
          - name: country_area
            description: "Total Area per Country"
          - name: flag
            description: "Flagging"
      
      - name: dim_population
        columns:
          - name: country_id
            description: "Unique ID"
          - name: population
            description: "Total Area per Country"
          - name: flag
            description: "Flagging"
      
      - name: dim_continent
        columns:
          - name: id
            description: "Unique ID"
          - name: continent
            description: "Name Continental"
      
      - name: dim_country
        columns:
          - name: country_id
            description: "Unique ID"
          - name: country_cd
            description: "Country Code"
          - name: country
            description: "Country Name"
          - name: Capital
            description: "Capital Name"
          - name: continent
            description: "Continental"
          
          
      
            
          